  <!-- Invisible reCAPTCHA target used by Firebase Phone Auth on web. -->
  <div id="recaptcha-container"></div>

  <script>
    (function () {
      function updateRecaptchaVisibility() {
        var hash = window.location.hash || '';
        var path = hash.startsWith('#') ? hash.slice(1) : hash;
        var shouldShow = path.startsWith('/login') || path.startsWith('/otp');
        document.documentElement.classList.toggle('show-recaptcha', shouldShow);
      }

      window.addEventListener('hashchange', updateRecaptchaVisibility);
      updateRecaptchaVisibility();
    })();
  </script>
