<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="delivero_flutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>delivero_flutter</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #ffffff;
      font-family: 'Geist', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2px;
      padding: 24px;
      text-align: center;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div id="loading">Loading…</div>
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;

      navigator.serviceWorker
        .getRegistrations()
        .then(function (regs) {
          return Promise.all(
            regs.map(function (reg) {
              return reg.unregister();
            }),
          );
        })
        .catch(function () {});

      if ('caches' in window) {
        caches
          .keys()
          .then(function (keys) {
            return Promise.all(
              keys.map(function (k) {
                return caches.delete(k);
              }),
            );
          })
          .catch(function () {});
      }
    })();

    function setLoadingText(text) {
      var el = document.getElementById('loading');
      if (el) el.textContent = text;
    }

    function removeLoading() {
      var el = document.getElementById('loading');
      if (el) el.remove();
    }

    window.addEventListener('flutter-first-frame', removeLoading);
    document.addEventListener('flutter-first-frame', removeLoading);

    window.addEventListener('error', function (e) {
      var lines = [];
      lines.push('Web error: ' + (e && e.message ? e.message : 'Unknown error'));
      if (e && e.filename) {
        lines.push(e.filename + ':' + (e.lineno || 0) + ':' + (e.colno || 0));
      }
      if (e && e.error && e.error.stack) {
        lines.push('');
        lines.push(String(e.error.stack));
      }
      setLoadingText(lines.join('\n'));
    });

    window.addEventListener('unhandledrejection', function (e) {
      var reason = e && e.reason ? e.reason : 'Unknown error';
      var text = reason && reason.toString ? reason.toString() : String(reason);
      setLoadingText('Web error: ' + text);
    });

    setTimeout(function () {
      var el = document.getElementById('loading');
      if (!el) return;

      function describeResult(name, ok, status, contentType) {
        var bits = [];
        bits.push(ok ? 'OK' : 'FAIL');
        if (status) bits.push(String(status));
        if (contentType) bits.push(contentType);
        return name + ': ' + bits.join(' ');
      }

      function head(url, name) {
        return fetch(url, { method: 'HEAD', cache: 'no-store' })
          .then(function (res) {
            return describeResult(
              name,
              res.ok,
              res.status,
              res.headers.get('content-type') || '',
            );
          })
          .catch(function (err) {
            return describeResult(name, false, '', err && err.message ? err.message : 'fetch failed');
          });
      }

      Promise.all([
        head('flutter_bootstrap.js', 'flutter_bootstrap.js'),
        head('main.dart.js', 'main.dart.js'),
        head('version.json', 'version.json'),
        head('canvaskit/canvaskit.wasm', 'canvaskit.wasm'),
        head('assets/FontManifest.json', 'FontManifest.json'),
      ]).then(function (lines) {
        setLoadingText('Still loading…\n\n' + lines.join('\n'));
      });
    }, 8000);
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script
    src="flutter_bootstrap.js"
    defer
    onerror="setLoadingText('Web error: failed to load flutter_bootstrap.js')"
  ></script>
</body>
</html>
